
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrostMute</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(circle at 15% 15%, #315b91, transparent 45%),
        radial-gradient(circle at 85% 85%, #454080, transparent 45%),
        #101827;
}

.container {
    width: min(370px, 90%);
    padding: 35px;
    border-radius: 30px;

    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.23);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.35),
        inset 0 1px 1px rgba(255,255,255,.2);
}

.logo {
    font-size: 38px;
    margin-bottom: 12px;
}

h1 {
    margin: 0;
    font-size: 30px;
}

.subtitle {
    color: #aabbd3;
    margin-top: 8px;
    font-size: 13px;
}

.status-card {
    margin-top: 30px;
    padding: 22px;
    border-radius: 22px;

    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.16);

    text-align: center;
    transition: .3s;
}

.status-icon {
    font-size: 35px;
    margin-bottom: 10px;
}

.status-title {
    font-size: 22px;
    font-weight: bold;
}

.status-description {
    color: #aabbd3;
    font-size: 12px;
    margin-top: 7px;
}

.setting {
    margin-top: 20px;
    padding: 18px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    border-radius: 20px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.16);
}

.label {
    font-size: 13px;
    font-weight: bold;
}

.switch {
    width: 60px;
    height: 34px;
    position: relative;
    border-radius: 50px;

    border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.15);

    cursor: pointer;
    transition: .3s;
}

.switch::before {
    content: "";
    position: absolute;

    width: 26px;
    height: 26px;
    left: 3px;
    top: 3px;

    border-radius: 50%;
    background: linear-gradient(145deg, white, #cbd8ec);

    box-shadow: 0 2px 8px rgba(0,0,0,.3);
    transition: .3s;
}

.switch.active {
    background: linear-gradient(135deg, #65baff, #8581ff);
}

.switch.active::before {
    transform: translateX(26px);
}

.footer {
    margin-top: 25px;
    text-align: center;
    color: #8294ad;
    font-size: 10px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">❄️</div>

    <h1>FrostMute</h1>

    <div class="subtitle">
        Tu espacio, en calma.
    </div>

    <!-- ESTADO -->
    <div class="status-card">

        <div class="status-icon" id="statusIcon">
            🔊
        </div>

        <div class="status-title" id="statusTitle">
            RUIDO
        </div>

        <div class="status-description" id="statusDescription">
            Notificaciones activas
        </div>

    </div>

    <!-- SWITCH -->
    <div class="setting">

        <div class="label">
            Silenciar Notificaciones
        </div>

        <button
            class="switch"
            id="toggle"
            role="switch"
            aria-checked="false"
            aria-label="Silenciar Notificaciones">
        </button>

    </div>

    <div class="footer">
        FROSTMUTE · LESS NOISE, MORE FOCUS
    </div>

</div>

<script>

// Recuperar estado guardado
let isMuted = localStorage.getItem("frostmute") === "true";

const toggle = document.getElementById("toggle");
const statusIcon = document.getElementById("statusIcon");
const statusTitle = document.getElementById("statusTitle");
const statusDescription = document.getElementById("statusDescription");

// Actualizar interfaz
function updateInterface() {

    toggle.classList.toggle("active", isMuted);

    toggle.setAttribute("aria-checked", isMuted);

    if (isMuted) {

        statusIcon.textContent = "❄️";
        statusTitle.textContent = "SILENCIO";
        statusDescription.textContent =
            "Silencio activado en FrostMute";

        statusTitle.style.color = "#80caff";

    } else {

        statusIcon.textContent = "🔊";
        statusTitle.textContent = "RUIDO";
        statusDescription.textContent =
            "Notificaciones activas";

        statusTitle.style.color = "#ffcf83";

    }
}

// Cambiar estado
toggle.addEventListener("click", () => {

    isMuted = !isMuted;

    // Guardar permanentemente
    localStorage.setItem("frostmute", isMuted);

    updateInterface();

});

// Cargar estado al abrir
updateInterface();

</script>

</body>
</html>
